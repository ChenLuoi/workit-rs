[package]
name = "workit-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A multi-repository Git workspace and task worktree manager"
license = "MIT"
default-run = "wk"
publish = ["crates-io"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/README.zh-CN.md", "/AGENTS.md", "/LICENSE"]

[[bin]]
name = "wk"
path = "src/main.rs"

[profile.release]
strip = "symbols"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
indicatif = { version = "0.18", default-features = false }
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
tempfile = "3"
