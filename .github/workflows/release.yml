name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      npm_run_id:
        description: Retry npm publication from a verified tag run (empty for a build rehearsal)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !inputs.npm_run_id }}
    uses: ./.github/workflows/ci.yml
  validate:
    if: ${{ !inputs.npm_run_id }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: rustup default 1.94.0
      - run: node scripts/npm-package.mjs check
      - if: github.event_name == 'push'
        run: node scripts/npm-package.mjs check "$GITHUB_REF_NAME"
      - run: cargo test --locked
      - run: cargo package --locked --registry crates-io
      - run: mkdir -p dist && npm pack --pack-destination dist
      - uses: actions/upload-artifact@v7
        with:
          name: npm-main
          path: dist/*.tgz
          if-no-files-found: error
      - id: targets
        run: echo "matrix=$(node scripts/npm-package.mjs matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: rustup toolchain install 1.94.0 --profile minimal --target "${{ matrix.rust }}"
      - if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo +1.94.0 build --release --locked --target "${{ matrix.rust }}"
      - if: "!endsWith(matrix.target, '-musl')"
        run: cargo +1.94.0 test --locked --target "${{ matrix.rust }}"
      - run: |
          binary="target/${{ matrix.rust }}/release/${{ matrix.binary }}"
          "$binary" --version
          node scripts/npm-package.mjs stage "${{ matrix.target }}" "$binary" dist/platform
          npm pack ./dist/platform --pack-destination dist
      - uses: actions/download-artifact@v8
        with:
          name: npm-main
          path: dist/launcher
      - if: "!endsWith(matrix.target, '-musl')"
        run: bash scripts/test-npm-artifacts.sh ./dist/launcher/*.tgz ./dist/*.tgz
      - if: endsWith(matrix.target, '-musl')
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace node:24-alpine \
            sh -ec 'apk add --no-cache bash git && bash scripts/test-npm-artifacts.sh ./dist/launcher/*.tgz ./dist/*.tgz'
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: dist/*.tgz
          if-no-files-found: error

  npm-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          merge-multiple: true
          path: dist
      - run: node scripts/publish-npm.mjs dist --dry-run
      - name: Assemble binaries from the tested platform packages
        run: node scripts/npm-package.mjs github-assets dist dist/github
      - name: Verify GitHub Release assets
        working-directory: dist/github
        run: |
          sha256sum --check SHA256SUMS
          version=$(jq -r .version release-manifest.json)
          binary="./workit-rs-${version}-linux-x64-musl"
          test "$("$binary" --version)" = "wk $version"
      - uses: actions/upload-artifact@v7
        with:
          name: github-release-assets
          path: dist/github/
          if-no-files-found: error

  github-release:
    needs: [ci, npm-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: github-release-assets
          path: assets
      - name: Publish verified binaries on the tagged GitHub Release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check SHA256SUMS
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            flags=(--draft --verify-tag --generate-notes --title "$tag")
            if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" "${flags[@]}" --notes \
              "Download the executable for your platform and verify it with SHA256SUMS. [Installation instructions](https://github.com/$GH_REPO/blob/$tag/README.md#install)"
          fi
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == true ]]; then
            gh release upload "$tag" ./* --clobber
            gh release edit "$tag" --draft=false
          else
            gh release download "$tag" --dir "$RUNNER_TEMP/published"
            diff -qr . "$RUNNER_TEMP/published"
          fi

  crates-io:
    needs: [ci, npm-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: cargo +1.94.0 publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npmjs:
    needs: [ci, npm-check]
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.ci.result == 'success' && needs.npm-check.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.npm_run_id != '' && github.ref_name == github.event.repository.default_branch))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify the original tagged build for npm recovery
        if: inputs.npm_run_id
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.npm_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          tag="v$(node -p "require('./package.json').version")"
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" |
            jq -e --arg tag "$tag" --arg sha "$commit" --arg repo "$GITHUB_REPOSITORY" '
              .path == ".github/workflows/release.yml" and .event == "push" and
              .head_repository.full_name == $repo and .head_branch == $tag and .head_sha == $sha'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" |
            jq -e '.jobs | ([.[] | select(.name == "validate" and .conclusion == "success")] | length == 1) and
              ([.[] | select(.name | startswith("build ("))] | length == 7 and all(.conclusion == "success")) and
              ([.[] | select(.name | startswith("ci / cli ("))] | length == 3 and all(.conclusion == "success"))'
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.npm_run_id || github.run_id }}
          pattern: npm-*
          merge-multiple: true
          path: dist
      - if: inputs.npm_run_id
        run: node scripts/publish-npm.mjs dist --dry-run
      - run: node scripts/publish-npm.mjs dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
