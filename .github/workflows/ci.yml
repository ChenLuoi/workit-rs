name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - if: runner.os == 'Linux'
        run: cargo +1.94.0 fmt --check
      - run: cargo +1.94.0 clippy --locked --release --all-targets -- -D warnings
      # Integration tests build the release binary used by both smoke tests below.
      - run: cargo +1.94.0 test --release --locked
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - if: runner.os == 'macOS'
        run: command -v socat || brew install socat
      - if: runner.os == 'Linux'
        run: command -v socat || (sudo apt-get update && sudo apt-get install -y socat)
      - if: runner.os != 'Windows'
        timeout-minutes: 4
        run: node scripts/smoke-interactive.mjs target/release/wk
      - shell: bash
        run: bash scripts/smoke-npm.sh "target/release/wk${{ runner.os == 'Windows' && '.exe' || '' }}"
