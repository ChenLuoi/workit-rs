name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.94.0 fmt --check
      - run: cargo +1.94.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.94.0 test --locked
      - run: cargo +1.94.0 build --release --locked
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: bash scripts/smoke-npm.sh
